name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12          # apt 偶尔卡住，别让它挂 6 小时
    strategy:
      fail-fast: false      # 一个版本挂了不要取消另一个，否则看不到全貌
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install ffmpeg
        # --no-install-recommends 少装几十个可选的依赖，apt 快得多；也少一个卡住的点
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: syntax check
        run: for f in src/*.js bin/*.mjs scripts/*.mjs; do node --check "$f"; done

      - name: unit + e2e tests
        run: npm test
        # test/contract.test.mjs self-skips when no local DSH install is present.
